version: '3.8'

services:
  # 1. The Database Container
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      # These set up the default admin user for the DB
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    volumes:
      # This ensures database data survives even if the container is destroyed
      - mongo-data:/data/db
    networks:
      - mlops-network

  # 2. The Database UI Container
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      # Notice how it connects using the container name "mongodb" as the hostname!
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
    ports:
      - "8081:8081"
    networks:
      - mlops-network

  # 3. Your Custom Python App Container
  streamlit-app:
    # "build: ." tells compose to look for the Dockerfile in the current directory and build it
    build: .
    container_name: streamlit-dev
    depends_on:
      - mongodb
    environment:
      # We pass environment variables into the Python script here
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=password
    ports:
      - "8501:8501"
    volumes:
      # This maps your local 'src' folder into the container. 
      # Now if you edit app.py locally, Streamlit updates instantly without rebuilding the image!
      - ./src:/app/src
    networks:
      - mlops-network

# Define the persistent volume for the database
volumes:
  mongo-data:

    # Define a private bridge network for these three containers to communicate securely
networks:
  mlops-network:
    driver: bridge
