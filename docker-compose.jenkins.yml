services:
  # Jenkins Controller Container
  # Mounts the host Docker socket so the Docker Cloud plugin can launch
  # ephemeral agent containers on the host daemon (DevOps Journey style).
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"   # Jenkins Web UI
      - "50000:50000" # JNLP Agent TCP Port for Inbound Agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mlops-network

volumes:
  jenkins_home:
    external: true

networks:
  mlops-network:
    name: streamlit_nana_tutorial_mlops-network
    external: true
