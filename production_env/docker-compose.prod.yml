name: streamlit_prod

services:
  streamlit-prod:
    image: localhost:8082/mlops-lab/streamlit-app:latest
    container_name: streamlit-prod
    ports:
      - "8502:8501"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=admin
      - MONGO_PASSWORD=password
    networks:
      - mlops-network

networks:
  mlops-network:
    name: streamlit_nana_tutorial_mlops-network
    external: true
